# Standalone SonarQube stack — static code analysis (bugs, code smells,
# security hotspots, maintainability). Separate from Dev/Prod app environments.
#
# ⚠️ BEFORE FIRST RUN — SonarQube needs these host kernel settings, or it
# will fail to start (its embedded Elasticsearch requires them):
#
#   sudo sysctl -w vm.max_map_count=262144
#   sudo sysctl -w fs.file-max=65536
#
# To make this survive a reboot, add these two lines to /etc/sysctl.conf:
#   vm.max_map_count=262144
#   fs.file-max=65536
#
# IMPORTANT: change POSTGRES_PASSWORD below before going live.
#
# Usage:
#   docker compose -f docker-compose.sonarqube.yml -p sonarqube up -d
#   Dashboard: http://<your-vm-ip>:9000   (first login: admin / admin)

services:
  sonarqube_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: change-this-sonar-db-password
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    restart: unless-stopped
    depends_on:
      - sonarqube_db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: change-this-sonar-db-password
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
